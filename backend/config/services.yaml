# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # D-48 (docs/specs/2026-08-21-backoffice-foundation.md): the admin firewall's pattern and every
    # admin route are compiled from this parameter at container-build time — changing
    # ADMIN_PATH_PREFIX requires a cache clear/rebuild, not just an env change, because Symfony
    # compiles firewall patterns and route paths into the container.
    admin.path_prefix: '%env(ADMIN_PATH_PREFIX)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # Auth and accounts (docs/specs/2026-08-21-auth-and-accounts.md) — scalar env values,
            # bound globally by constructor-parameter name so any service can just ask for them.
            $jwtTtl: '%env(JWT_TTL)%'
            $refreshTokenTtl: '%env(REFRESH_TOKEN_TTL)%'
            $requireVerifiedEmail: '%env(bool:AUTH_REQUIRE_VERIFIED_EMAIL)%'
            $mailFromAddress: '%env(MAILER_FROM_ADDRESS)%'
            $webAppUrl: '%env(WEB_APP_URL)%'
            $verificationTokenTtl: '%env(EMAIL_VERIFICATION_TOKEN_TTL)%'
            $resetTokenTtl: '%env(PASSWORD_RESET_TOKEN_TTL)%'
            $secure: '%env(bool:AUTH_COOKIE_SECURE)%'
            # Dedicated "security" Monolog channel for reuse-detection and rate-limiter
            # fail-closed events (config/packages/monolog.yaml), findable without scraping the
            # whole app log.
            $securityLogger: '@monolog.logger.security'
            # AuditLogEntry.actorLabel / personal-data oldValue-newValue digests (D-43) — a keyed
            # HMAC, not the audit-specific secret family; reusing APP_SECRET is fine since the
            # digest is never exposed and the key never needs independent rotation from the app
            # itself.
            $digestKey: '%env(APP_SECRET)%'
            # AC-5.3: the admin's TOTP secret is encrypted at rest with libsodium xchacha20poly1305
            # (App\Security\Admin\TotpSecretEncryptor), same scheme docs/env-vars.md documents for
            # provider OAuth tokens — a dedicated key, never reused across encryption purposes.
            $base64Key: '%env(ADMIN_TOTP_ENCRYPTION_KEY)%'
            $adminPathPrefix: '%admin.path_prefix%'
            $allowlistCsv: '%env(ADMIN_IP_ALLOWLIST)%'
            $appEnv: '%env(APP_ENV)%'
            $totpIssuer: '%env(ADMIN_TOTP_ISSUER)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Entity/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Health check services (backend-skeleton feature) — each dependency check is tagged so
    # HealthChecker can be handed the whole set as an iterator without knowing how many there
    # are or naming them individually (App\Service\Health\README.md).
    App\Service\Health\DatabaseCheck:
        tags: ['app.health_check']

    App\Service\Health\RedisCheck:
        arguments:
            $redisUrl: '%env(REDIS_URL)%'
        tags: ['app.health_check']

    App\Service\Health\HealthChecker:
        arguments:
            $checks: !tagged_iterator app.health_check

    # Adds the 503 response to GET /api/health in the generated OpenAPI document (AC-3.3) — see
    # App\OpenApi\HealthOpenApiFactory for why this can't be done via the #[Get] attribute alone.
    App\OpenApi\HealthOpenApiFactory:
        decorates: 'api_platform.openapi.factory'
        arguments:
            $decorated: '@.inner'

    # App\Service\Security\EmailVerificationService and App\Service\Security\PasswordResetService
    # each want a `$tokenTtl` with a different value, so — unlike everything else in this feature —
    # they can't use the global bind above; wired explicitly here instead.
    App\Service\Security\EmailVerificationService:
        arguments:
            $tokenTtl: '%env(EMAIL_VERIFICATION_TOKEN_TTL)%'

    App\Service\Security\PasswordResetService:
        arguments:
            $tokenTtl: '%env(PASSWORD_RESET_TOKEN_TTL)%'

    # Redacts credentials/tokens from every log record, everywhere (AC-11.2).
    App\Service\Logging\SensitiveDataProcessor:
        tags: ['monolog.processor']

    # Backoffice foundation (docs/specs/2026-08-21-backoffice-foundation.md). Kept `public: true`
    # so `AuditLoggerTest` can exercise it directly before the first real caller (suspend/delete/
    # reveal-email controllers, added later in this feature) exists to pull it in via autowiring —
    # without this, Symfony's container compiler prunes an unreferenced private service.
    App\Service\Admin\AuditLogger:
        public: true

    # doctrine/doctrine-bundle 3.x dropped `doctrine.event_subscriber` entirely — even though this
    # class implements Doctrine\Common\EventSubscriber, each Doctrine event must be tagged
    # individually as `doctrine.event_listener` or it is never registered on the EventManager
    # (AC-12.4 would silently not hold without this).
    App\EventSubscriber\AuditLogAppendOnlySubscriber:
        tags:
            - { name: 'doctrine.event_listener', event: 'preUpdate' }
            - { name: 'doctrine.event_listener', event: 'preRemove' }

    # Backs the admin session (D-54, config/packages/framework.yaml) — a raw phpredis connection
    # built from REDIS_URL via symfony/cache's own DSN parser, so sessions survive a multi-instance
    # deployment without sticky sessions. Nothing else in the app should depend on this `Redis`
    # service directly; it exists only to feed RedisSessionHandler.
    Redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments: ['%env(REDIS_URL)%']

    Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
        arguments: ['@Redis']

    # AC-4.2: lockout state shares the same Redis-backed pool as the rate limiters (config/packages/
    # rate_limiter.yaml) rather than a dedicated one — both are ephemeral, both must survive across
    # app instances, and a second pool buys nothing here.
    App\Security\Admin\AdminLockoutTracker:
        arguments: ['@cache.rate_limiter']
