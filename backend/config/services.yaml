# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

imports:
    # Song matching calibration (docs/specs/2026-08-22-spike-song-matching.md, D-110/D-116). Two data
    # files rather than inline parameters: a threshold change must be reviewable on its own, and the
    # non-song lexicon is explicitly data-not-code so adding a language is a config PR.
    - { resource: 'matching/profiles.yaml' }
    - { resource: 'matching/non_song_terms.yaml' }

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # D-48 (docs/specs/2026-08-21-backoffice-foundation.md): the admin firewall's pattern and every
    # admin route are compiled from this parameter at container-build time — changing
    # ADMIN_PATH_PREFIX requires a cache clear/rebuild, not just an env change, because Symfony
    # compiles firewall patterns and route paths into the container.
    admin.path_prefix: '%env(ADMIN_PATH_PREFIX)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # Auth and accounts (docs/specs/2026-08-21-auth-and-accounts.md) — scalar env values,
            # bound globally by constructor-parameter name so any service can just ask for them.
            $jwtTtl: '%env(JWT_TTL)%'
            $refreshTokenTtl: '%env(REFRESH_TOKEN_TTL)%'
            $requireVerifiedEmail: '%env(bool:AUTH_REQUIRE_VERIFIED_EMAIL)%'
            $mailFromAddress: '%env(MAILER_FROM_ADDRESS)%'
            $webAppUrl: '%env(WEB_APP_URL)%'
            $verificationTokenTtl: '%env(EMAIL_VERIFICATION_TOKEN_TTL)%'
            $resetTokenTtl: '%env(PASSWORD_RESET_TOKEN_TTL)%'
            $secure: '%env(bool:AUTH_COOKIE_SECURE)%'
            # Dedicated "security" Monolog channel for reuse-detection and rate-limiter
            # fail-closed events (config/packages/monolog.yaml), findable without scraping the
            # whole app log.
            $securityLogger: '@monolog.logger.security'
            # AuditLogEntry.actorLabel / personal-data oldValue-newValue digests (D-43) — a keyed
            # HMAC, not the audit-specific secret family; reusing APP_SECRET is fine since the
            # digest is never exposed and the key never needs independent rotation from the app
            # itself.
            $digestKey: '%env(APP_SECRET)%'
            # AC-5.3: the admin's TOTP secret is encrypted at rest with libsodium xchacha20poly1305
            # (App\Security\Admin\TotpSecretEncryptor), same scheme docs/env-vars.md documents for
            # provider OAuth tokens — a dedicated key, never reused across encryption purposes.
            $base64Key: '%env(ADMIN_TOTP_ENCRYPTION_KEY)%'
            $adminPathPrefix: '%admin.path_prefix%'
            $allowlistCsv: '%env(ADMIN_IP_ALLOWLIST)%'
            $appEnv: '%env(APP_ENV)%'
            $totpIssuer: '%env(ADMIN_TOTP_ISSUER)%'
            # setlist.fm integration (docs/specs/2026-08-22-setlistfm-integration.md). Scalar
            # config only — the API key itself is bound explicitly, once, on SetlistFmClient below
            # (D-58/US-12), never through this global bind, so it can never be pulled in by a
            # constructor parameter named `$apiKey` anywhere else in the app.
            $ratePerSecond: '%env(int:SETLISTFM_RATE_PER_SECOND)%'
            $dailyBudget: '%env(int:SETLISTFM_DAILY_BUDGET)%'
            $cacheTtl: '%env(int:SETLISTFM_CACHE_TTL)%'
            $tokenWaitSeconds: '%env(float:SETLISTFM_TOKEN_WAIT)%'
            $refreshBudgetShare: '%env(float:SETLISTFM_REFRESH_BUDGET_SHARE)%'
            $setlistfmLogger: '@monolog.logger.setlistfm'
            # Playlist generation (docs/specs/2026-08-23-spike-playlist-pipeline.md,
            # docs/specs/2026-08-23-playlist-fast-mode-backend.md). P-1/P-4/§4/§5's numeric
            # constants, bound globally so every stage/command that needs one just asks for it.
            $maxBands: '%env(int:GENERATION_MAX_BANDS)%'
            $maxSongs: '%env(int:GENERATION_MAX_SONGS)%'
            $setlistPages: '%env(int:GENERATION_SETLIST_PAGES)%'
            $insertBatchSize: '%env(int:GENERATION_INSERT_BATCH_SIZE)%'
            $rateLimitInlineRetries: '%env(int:GENERATION_RATE_LIMIT_INLINE_RETRIES)%'
            $maxBlockCycles: '%env(int:GENERATION_MAX_BLOCK_CYCLES)%'
            $suspendedSetlistChoiceTtlSeconds: '%env(int:SUSPENDED_SETLIST_CHOICE_TTL)%'
            $suspendedVersionChoiceTtlSeconds: '%env(int:SUSPENDED_VERSION_CHOICE_TTL)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Entity/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Health check services (backend-skeleton feature) — each dependency check is tagged so
    # HealthChecker can be handed the whole set as an iterator without knowing how many there
    # are or naming them individually (App\Service\Health\README.md).
    App\Service\Health\DatabaseCheck:
        tags: ['app.health_check']

    App\Service\Health\RedisCheck:
        arguments:
            $redisUrl: '%env(REDIS_URL)%'
        tags: ['app.health_check']

    App\Service\Health\HealthChecker:
        arguments:
            $checks: !tagged_iterator app.health_check

    # Adds the 503 response to GET /api/health in the generated OpenAPI document (AC-3.3) — see
    # App\OpenApi\HealthOpenApiFactory for why this can't be done via the #[Get] attribute alone.
    App\OpenApi\HealthOpenApiFactory:
        decorates: 'api_platform.openapi.factory'
        arguments:
            $decorated: '@.inner'

    # App\Service\Security\EmailVerificationService and App\Service\Security\PasswordResetService
    # each want a `$tokenTtl` with a different value, so — unlike everything else in this feature —
    # they can't use the global bind above; wired explicitly here instead.
    App\Service\Security\EmailVerificationService:
        arguments:
            $tokenTtl: '%env(EMAIL_VERIFICATION_TOKEN_TTL)%'

    App\Service\Security\PasswordResetService:
        arguments:
            $tokenTtl: '%env(PASSWORD_RESET_TOKEN_TTL)%'

    # Redacts credentials/tokens from every log record, everywhere (AC-11.2).
    App\Service\Logging\SensitiveDataProcessor:
        tags: ['monolog.processor']

    # Backoffice foundation (docs/specs/2026-08-21-backoffice-foundation.md). Kept `public: true`
    # so `AuditLoggerTest` can exercise it directly before the first real caller (suspend/delete/
    # reveal-email controllers, added later in this feature) exists to pull it in via autowiring —
    # without this, Symfony's container compiler prunes an unreferenced private service.
    App\Service\Admin\AuditLogger:
        public: true

    # doctrine/doctrine-bundle 3.x dropped `doctrine.event_subscriber` entirely — even though this
    # class implements Doctrine\Common\EventSubscriber, each Doctrine event must be tagged
    # individually as `doctrine.event_listener` or it is never registered on the EventManager
    # (AC-12.4 would silently not hold without this).
    App\EventSubscriber\AuditLogAppendOnlySubscriber:
        tags:
            - { name: 'doctrine.event_listener', event: 'preUpdate' }
            - { name: 'doctrine.event_listener', event: 'preRemove' }

    # Backs the admin session (D-54, config/packages/framework.yaml) — a raw phpredis connection
    # built from REDIS_URL via symfony/cache's own DSN parser, so sessions survive a multi-instance
    # deployment without sticky sessions. Nothing else in the app should depend on this `Redis`
    # service directly; it exists only to feed RedisSessionHandler.
    Redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments: ['%env(REDIS_URL)%']

    Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
        arguments: ['@Redis']

    # AC-4.2: lockout state shares the same Redis-backed pool as the rate limiters (config/packages/
    # rate_limiter.yaml) rather than a dedicated one — both are ephemeral, both must survive across
    # app instances, and a second pool buys nothing here.
    App\Security\Admin\AdminLockoutTracker:
        arguments: ['@cache.rate_limiter']

    # setlist.fm integration (docs/specs/2026-08-22-setlistfm-integration.md, D-61). A dedicated
    # phpredis connection, separate from the `Redis` service above (which exists only to feed
    # RedisSessionHandler) — the budget gate's keys (rate bucket, daily counter, breaker) have
    # nothing to do with sessions and shouldn't share a service whose contract says "nothing else
    # depends on this".
    setlistfm.redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments: ['%env(REDIS_URL)%']

    # Kept public so tests can drive the budget gate directly (AC-7.4's concurrency test, AC-7.6's
    # fail-closed test) without needing a real HTTP call through the full gateway — same rationale
    # as AuditLogger's public:true above.
    App\Service\Setlist\SetlistFmBudget:
        public: true
        arguments:
            $redis: '@setlistfm.redis'

    App\Service\Setlist\SetlistCacheMetrics:
        public: true
        arguments:
            $redis: '@setlistfm.redis'

    App\Service\Setlist\SetlistRefreshRunLog:
        public: true
        arguments:
            $redis: '@setlistfm.redis'

    App\Service\Setlist\SetlistCache:
        public: true
        arguments:
            $redis: '@setlistfm.redis'

    # setlist.fm integration (docs/specs/2026-08-22-setlistfm-integration.md, D-58/US-12). The ONLY
    # place `SETLISTFM_API_KEY` and the scoped `setlistfm.client` HTTP client are wired in. No other
    # service in the app may declare a constructor argument that resolves to either — AC-6.5 and
    # AC-12.1 are enforced by App\Tests\Unit\Service\Setlist\SetlistGatewayIsOnlyDoorTest, a static
    # scan of src/ outside this directory.
    App\Service\Setlist\SetlistFmClient:
        arguments:
            $httpClient: '@setlistfm.client'
            $apiKeyForRedactionCheck: '%env(SETLISTFM_API_KEY)%'

    # --- Streaming port and account linking -----------------------------------------------------
    # (docs/specs/2026-08-22-streaming-port-and-account-linking.md, D-72/D-82/AC-9.6)

    # D-72: every adapter is collected here via its tag and indexed by key() — nothing names an
    # adapter class. TestDoubleStreamingProvider (tests/Support/Streaming/) joins this same
    # iterator purely by carrying the tag, in the when@test block below (AC-9.5).
    App\Service\Streaming\StreamingProviderLocator:
        arguments:
            $providers: !tagged_iterator app.streaming_provider

    # Backoffice provider configuration (docs/specs/2026-08-22-backoffice-provider-configuration.md,
    # D-89). Dedicated Redis connection, same rationale as streaming.redis/setlistfm.redis above —
    # the settings snapshot has nothing to do with sessions or those features' own ephemeral keys.
    provider.redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments: ['%env(REDIS_URL)%']

    App\Service\Provider\ProviderRegistry:
        arguments:
            $redis: '@provider.redis'
            $cacheTtlSeconds: '%env(int:PROVIDER_SETTINGS_CACHE_TTL)%'

    App\Service\Provider\ProviderSettingWriter:
        arguments:
            $redis: '@provider.redis'

    # D-89/AC-10.2: ProviderRegistry is the only implementation registered for this alias —
    # StaticProviderAvailability (prompt 10's placeholder) is deleted, not just unregistered, so
    # "which one is wired?" is never a live question.
    App\Service\Provider\ProviderAvailability:
        alias: App\Service\Provider\ProviderRegistry

    # Dedicated Redis connection for pending-link/link-result state (D-76) — same rationale as
    # setlistfm.redis above: ephemeral keys unrelated to sessions, so not shared with the `Redis`
    # service that only feeds RedisSessionHandler.
    streaming.redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments: ['%env(REDIS_URL)%']

    App\Service\Streaming\Link\PendingLinkStore:
        arguments:
            $redis: '@streaming.redis'
            $ttlSeconds: '%env(int:STREAMING_LINK_STATE_TTL)%'

    App\Service\Streaming\Link\LinkResultStore:
        arguments:
            $redis: '@streaming.redis'

    App\Service\Streaming\Link\LinkFlowService:
        arguments:
            $redirectUrisByProvider:
                spotify: '%env(SPOTIFY_REDIRECT_URI)%'
            $webReturnUrl: '%env(STREAMING_LINK_RETURN_URL_WEB)%'
            $nativeReturnUrl: '%env(STREAMING_LINK_RETURN_URL_NATIVE)%'
            $streamingLinkStartLimiter: '@limiter.streaming_link_start'

    App\Service\Streaming\Link\StreamingTokenManager:
        arguments:
            $refreshSkewSeconds: '%env(int:STREAMING_TOKEN_REFRESH_SKEW)%'

    # The ONLY place `SPOTIFY_CLIENT_ID`/`SPOTIFY_CLIENT_SECRET`/`SPOTIFY_ACCOUNTS_BASE_URL` and the
    # scoped `spotify.*.client` HTTP clients are wired in (D-82/AC-9.6) — everything else in
    # src/Service/Streaming/Spotify/ receives them only through this adapter's own dependents.
    App\Service\Streaming\Spotify\SpotifyHttpClient:
        arguments:
            $accountsClient: '@spotify.accounts.client'
            $apiClient: '@spotify.api.client'
            $streamingLogger: '@monolog.logger.streaming'

    App\Service\Streaming\Spotify\SpotifyProvider:
        arguments:
            $clientId: '%env(SPOTIFY_CLIENT_ID)%'
            $clientSecret: '%env(SPOTIFY_CLIENT_SECRET)%'
            $accountsBaseUrl: '%env(SPOTIFY_ACCOUNTS_BASE_URL)%'
        tags: ['app.streaming_provider']

    # --- Song matching --------------------------------------------------------------------------
    # (docs/specs/2026-08-22-spike-song-matching.md)

    # Everything in App\Service\Matching\ is provider-agnostic and must stay that way — profile keys
    # are runtime strings, never PHP literals, which is what lets prompt 18 add a second provider's
    # calibration without a branch in any of these classes (D-118).
    App\Service\Matching\MatchProfileRegistry:
        arguments:
            $defaultProfile: '%matching.default_profile%'
            $overrides: '%matching.profile_overrides%'
            $algorithmVersion: '%matching.algorithm_version%'

    App\Service\Matching\NonSongClassifier:
        arguments:
            $alwaysTerms: '%matching.non_song_terms.always%'
            $positionSensitiveTerms: '%matching.non_song_terms.positionSensitive%'

    # Dedicated Redis connection for the resolution cache's front tier (spec 12 §8, D-121) — same
    # rationale as setlistfm.redis/provider.redis/streaming.redis above: ephemeral keys unrelated to
    # sessions, so not shared with the `Redis` service that only feeds RedisSessionHandler.
    matching.redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments: ['%env(REDIS_URL)%']

    # Public so tests can drive the cache directly (mirrors SetlistCache's rationale above).
    App\Service\Matching\Cache\TrackResolutionStore:
        public: true
        arguments:
            $redis: '@matching.redis'

    # The only public entry point into matching (mirrors SetlistGateway's single-door shape, D-58).
    App\Service\Matching\TrackMatcher:
        public: true

when@test:
    services:
        # AC-9.5's proof: registered ONLY by this tag, discovered by StreamingProviderLocator with
        # zero changes to any consuming class.
        App\Tests\Support\Streaming\TestDoubleStreamingProvider:
            tags: ['app.streaming_provider']
