# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # Auth and accounts (docs/specs/2026-08-21-auth-and-accounts.md) — scalar env values,
            # bound globally by constructor-parameter name so any service can just ask for them.
            $jwtTtl: '%env(JWT_TTL)%'
            $refreshTokenTtl: '%env(REFRESH_TOKEN_TTL)%'
            $requireVerifiedEmail: '%env(bool:AUTH_REQUIRE_VERIFIED_EMAIL)%'
            $mailFromAddress: '%env(MAILER_FROM_ADDRESS)%'
            $webAppUrl: '%env(WEB_APP_URL)%'
            $verificationTokenTtl: '%env(EMAIL_VERIFICATION_TOKEN_TTL)%'
            $resetTokenTtl: '%env(PASSWORD_RESET_TOKEN_TTL)%'
            $secure: '%env(bool:AUTH_COOKIE_SECURE)%'
            # Dedicated "security" Monolog channel for reuse-detection and rate-limiter
            # fail-closed events (config/packages/monolog.yaml), findable without scraping the
            # whole app log.
            $securityLogger: '@monolog.logger.security'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Entity/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Health check services (backend-skeleton feature) — each dependency check is tagged so
    # HealthChecker can be handed the whole set as an iterator without knowing how many there
    # are or naming them individually (App\Service\Health\README.md).
    App\Service\Health\DatabaseCheck:
        tags: ['app.health_check']

    App\Service\Health\RedisCheck:
        arguments:
            $redisUrl: '%env(REDIS_URL)%'
        tags: ['app.health_check']

    App\Service\Health\HealthChecker:
        arguments:
            $checks: !tagged_iterator app.health_check

    # Adds the 503 response to GET /api/health in the generated OpenAPI document (AC-3.3) — see
    # App\OpenApi\HealthOpenApiFactory for why this can't be done via the #[Get] attribute alone.
    App\OpenApi\HealthOpenApiFactory:
        decorates: 'api_platform.openapi.factory'
        arguments:
            $decorated: '@.inner'

    # App\Service\Security\EmailVerificationService and App\Service\Security\PasswordResetService
    # each want a `$tokenTtl` with a different value, so — unlike everything else in this feature —
    # they can't use the global bind above; wired explicitly here instead.
    App\Service\Security\EmailVerificationService:
        arguments:
            $tokenTtl: '%env(EMAIL_VERIFICATION_TOKEN_TTL)%'

    App\Service\Security\PasswordResetService:
        arguments:
            $tokenTtl: '%env(PASSWORD_RESET_TOKEN_TTL)%'

    # Redacts credentials/tokens from every log record, everywhere (AC-11.2).
    App\Service\Logging\SensitiveDataProcessor:
        tags: ['monolog.processor']
