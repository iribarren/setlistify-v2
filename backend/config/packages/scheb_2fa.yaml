# See the configuration reference at https://symfony.com/bundles/SchebTwoFactorBundle/8.x/configuration.html
#
# US-5 (docs/specs/2026-08-21-backoffice-foundation.md): TOTP and backup codes are both disabled by
# default in this bundle (`canBeEnabled()`) — `security_tokens` alone (the Flex recipe default)
# does NOT turn 2FA on; without the two `enabled: true` blocks below, every admin login silently
# skips straight to full authentication with password alone.
scheb_two_factor:
    # AdminUser is a plain model object (not a mapped Doctrine entity) — the default Doctrine
    # persister would try to `EntityManager::persist()` it and throw a mapping exception. See
    # App\Security\Admin\NullTwoFactorPersister.
    persister: App\Security\Admin\NullTwoFactorPersister
    security_tokens:
        - Symfony\Component\Security\Core\Authentication\Token\UsernamePasswordToken
        - Symfony\Component\Security\Http\Authenticator\Token\PostAuthenticationToken
    totp:
        enabled: true
        issuer: '%env(ADMIN_TOTP_ISSUER)%'
    backup_codes:
        enabled: true
