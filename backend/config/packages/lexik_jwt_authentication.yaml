lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: '%env(int:JWT_TTL)%'
    # The claim carrying the user's identity is named `sub` and holds the numeric user id
    # (App\Entity\User::getSub()) — never the email (AC-2.3). See config/packages/security.yaml.
    user_id_claim: sub
