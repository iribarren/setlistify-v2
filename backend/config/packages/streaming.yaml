# Streaming port and account linking (docs/specs/2026-08-22-streaming-port-and-account-linking.md,
# D-82/AC-9.6): the ONE dedicated file confining every Spotify-specific parameter/env binding. This
# is configuration, not a PHP symbol, so it sits outside the AC-9.4 architecture test's ban — but
# keeping it in exactly this one file is what makes the non-adapter footprint a single reviewable
# location, same spirit as config/packages/setlistfm.yaml's D-58 confinement.
framework:
    http_client:
        scoped_clients:
            spotify.accounts.client:
                base_uri: '%env(SPOTIFY_ACCOUNTS_BASE_URL)%'
                headers:
                    Accept: 'application/json'
                timeout: '%env(float:STREAMING_HTTP_TIMEOUT)%'
                max_duration: '%env(float:STREAMING_HTTP_TIMEOUT)%'
            spotify.api.client:
                base_uri: '%env(SPOTIFY_API_BASE_URL)%'
                headers:
                    Accept: 'application/json'
                timeout: '%env(float:STREAMING_HTTP_TIMEOUT)%'
                max_duration: '%env(float:STREAMING_HTTP_TIMEOUT)%'
