framework:
    router:
        # Configure how to generate URLs in non-HTTP contexts, such as CLI commands.
        # See https://symfony.com/doc/current/routing.html#generating-urls-in-commands
        #
        # A literal default rather than an env var: this is a harmless CLI-context fallback, not
        # infrastructure configuration, and D-5 (docs/specs/2026-08-21-backend-skeleton.md) avoids
        # adding an environment variable unless one is genuinely needed.
        default_uri: 'http://localhost'

when@prod:
    framework:
        router:
            strict_requirements: null
