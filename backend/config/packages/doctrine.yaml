doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # The server version is pinned via the `serverVersion` query parameter on DATABASE_URL
        # itself (see backend/.env.example) so the connection never queries PostgreSQL at boot
        # to discover it (AC-4.5, docs/specs/2026-08-21-backend-skeleton.md).

        # PDO::ATTR_TIMEOUT (constant value 2) => 2-second connection timeout, so a wedged
        # PostgreSQL cannot hang the health endpoint's database check (AC-2.4).
        options:
            2: 2

        profiling_collect_backtrace: '%kernel.debug%'

        # D-78/US-6: the streaming-account token columns' custom type. Encryption/decryption is
        # transparent to every consumer that just reads/writes the entity's properties — see
        # App\Doctrine\Type\EncryptedStringType's docblock for why it configures its cipher from
        # the real process environment rather than through this bundle's DI.
        types:
            encrypted_string: App\Doctrine\Type\EncryptedStringType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
