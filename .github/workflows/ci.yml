name: CI

# Runs on push to any branch and on pull requests targeting master (AC-6.1).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

# Least-privilege default; jobs opt into more only if a future step needs it.
permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the scan covers the whole pushed branch (AC-3.3)

      - name: Run gitleaks
        # Same invocation as the local pre-commit hook (.githooks/pre-commit), so a developer can
        # reproduce a CI failure locally with one command. No third-party Action, so no question of
        # a GITLEAKS_LICENSE requirement.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            git --config /repo/.gitleaks.toml --redact /repo

      - name: Check .env.example matches docs/env-vars.md
        run: ./scripts/check-env-vars-drift.sh

  backend:
    name: backend
    runs-on: ubuntu-latest
    # D-7 (docs/specs/2026-08-21-backend-skeleton.md): runs on the runner itself, with GitHub
    # Actions `services:` containers for PostgreSQL and Redis pinned to the same versions as
    # `compose.yaml`, and PHP set up via setup-php with the same extensions as
    # docker/backend/Dockerfile (D-9) — so the two environments are declared independently but
    # stay in lockstep (R-6: revisit if they drift). No real external API is ever called here —
    # see D-2 in docs/architecture.md.
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: setlistify
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: setlistify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U setlistify -d setlistify"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI-only, obviously-fake values — the same shape as backend/.env.example, never a real
      # secret (docs/env-vars.md rule zero; D-2).
      APP_ENV: dev
      APP_SECRET: ci-only-dummy-secret-never-a-real-value
      DATABASE_URL: postgresql://setlistify:changeme@127.0.0.1:5432/setlistify?serverVersion=17&charset=utf8
      REDIS_URL: redis://127.0.0.1:6379
      CORS_ALLOW_ORIGIN: ^https?://localhost(:[0-9]+)?$
      # Auth and accounts (docs/specs/2026-08-21-auth-and-accounts.md) — same dummy shape as
      # backend/.env.example. The JWT keypair itself isn't a value that fits an env var; it's
      # generated by the "Generate a JWT keypair" step below, using this passphrase.
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: ci-only-dummy-jwt-passphrase
      JWT_TTL: "900"
      REFRESH_TOKEN_TTL: "2592000"
      EMAIL_VERIFICATION_TOKEN_TTL: "86400"
      PASSWORD_RESET_TOKEN_TTL: "3600"
      AUTH_REQUIRE_VERIFIED_EMAIL: "false"
      AUTH_COOKIE_SECURE: "false"
      MAILER_DSN: "null://null"
      MAILER_FROM_ADDRESS: no-reply@setlistify.test
      WEB_APP_URL: http://localhost:8081
      LOCK_DSN: flock
      # Backoffice foundation (docs/specs/2026-08-21-backoffice-foundation.md) — CI-only dummy
      # values, never a real secret.
      ADMIN_PATH_PREFIX: /admin
      ADMIN_TOTP_ISSUER: Setlistify
      ADMIN_IP_ALLOWLIST: ""
      ADMIN_TOTP_ENCRYPTION_KEY: "qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqo="
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # Same extension set as docker/backend/Dockerfile's base stage (D-9) — pdo_pgsql for
          # Doctrine, intl for the validator/translation components, opcache, zip for Composer,
          # redis for the health check's PING and the future Messenger transport.
          extensions: pdo_pgsql, intl, opcache, zip, redis
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      # Auth and accounts (docs/specs/2026-08-21-auth-and-accounts.md): CI-only keypair, never
      # committed, matching JWT_PASSPHRASE above and mirroring the local dev setup in README.md.
      - name: Generate a JWT keypair
        working-directory: backend
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -out config/jwt/private.pem \
            -pkeyopt rsa_keygen_bits:4096 -aes256 -pass pass:"$JWT_PASSPHRASE"
          openssl pkey -in config/jwt/private.pem -passin pass:"$JWT_PASSPHRASE" \
            -pubout -out config/jwt/public.pem

      - name: Warm the dev container (needed by phpstan-symfony)
        working-directory: backend
        run: bin/console cache:warmup --env=dev --no-debug

      - name: Lint (CS-Fixer + PHPStan)
        working-directory: backend
        run: composer lint

      - name: Run migrations against the real PostgreSQL service (AC-8.4)
        working-directory: backend
        run: bin/console --env=dev doctrine:migrations:migrate --no-interaction

      - name: Create and migrate the test database
        working-directory: backend
        run: composer test:db

      - name: Test
        working-directory: backend
        run: composer test

      # D-10: the frontend job needs the OpenAPI document to regenerate frontend/api/ and check
      # it for staleness, but must stay free of PHP/PostgreSQL — so this job exports it once and
      # hands it off as a build artifact rather than the frontend job hitting a live backend.
      - name: Export the OpenAPI document (D-10)
        working-directory: backend
        run: bin/console api:openapi:export --output=openapi.json

      - name: Upload the OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: openapi-document
          path: backend/openapi.json
          retention-days: 1

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    # D-10: depends on `backend` for the OpenAPI document artifact (AC-6.2/AC-10.8) — this job
    # itself runs no PHP and no database.
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download the OpenAPI document
        uses: actions/download-artifact@v4
        with:
          name: openapi-document
          path: backend

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      # AC-6.5/AC-6.6: regenerate the client from the artifact above and fail if the committed
      # output differs — a stale client is a red build, not a discovery (D-10, R-1).
      - name: Check the generated API client is fresh
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code -- api/ || {
            echo "::error::frontend/api/ is stale. Run 'npm run generate:api' in frontend/ and commit the result.";
            exit 1;
          }

      - name: Test
        working-directory: frontend
        run: npm test

  compose-build-and-healthy:
    name: compose-build-and-healthy
    runs-on: ubuntu-latest
    # Validates that compose.yaml and the Dockerfiles build, and that the stack comes up
    # healthy — entirely against local services, no external API call (AC-6.3, AC-6.5, D-2).
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env files
        run: |
          cp backend/.env.example backend/.env.local
          cp frontend/.env.example frontend/.env.local

      - name: Build images
        run: docker compose build

      - name: Bring the stack up
        run: docker compose up -d

      - name: Wait for postgres, redis and backend to report healthy
        run: |
          deadline=$((SECONDS + 90))
          while true; do
            unhealthy=$(docker compose ps --format '{{.Name}} {{.Health}}' | grep -v -c 'healthy' || true)
            if [ "$unhealthy" -eq 0 ]; then
              echo "All services healthy."
              docker compose ps
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for services to become healthy." >&2
              docker compose ps
              docker compose logs
              exit 1
            fi
            sleep 3
          done

      - name: Probe backend health endpoint
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/api/health

      - name: Tear down
        if: always()
        run: docker compose down -v
